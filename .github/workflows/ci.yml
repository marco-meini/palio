# CI di Palio / Dimmelo: parte al push di un tag di versione (vX.Y.Z, es. creato con `npm version`).
# Controlla typecheck, test e build e, se passano, pubblica le immagini su GitHub Container
# Registry (ghcr.io/<owner>/palio-server|palio-client:X.Y.Z), che scripts/release.sh scarica sul
# server. Nessun accesso al server né al database: il rilascio resta manuale.
name: CI

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      # niente workspaces: root, server e client hanno ciascuno il suo package-lock.json
      - run: npm ci && npm ci --prefix server && npm ci --prefix client
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    name: Immagine ${{ matrix.app }}
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [server, client]
    steps:
      - uses: actions/checkout@v7
      # tag dell'immagine = versione; deve coincidere con package.json (lo legge release.sh)
      - id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          package="$(node -p "require('./package.json').version")"
          if [ "$version" != "$package" ]; then
            echo "::error::Il tag $GITHUB_REF_NAME non corrisponde a package.json ($package)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.app }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/palio-${{ matrix.app }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
