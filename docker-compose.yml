services:
  server:
    # PALIO_IMAGE_PREFIX (es. ghcr.io/<owner>/) per usare le immagini pubblicate dalla CI
    image: ${PALIO_IMAGE_PREFIX:-}palio-server:${PALIO_TAG:-latest}
    build:
      context: ./server
    env_file:
      - .env.production
    restart: unless-stopped
    networks:
      - postgres
      - dimmelo

  client:
    image: ${PALIO_IMAGE_PREFIX:-}palio-client:${PALIO_TAG:-latest}
    build:
      context: ./client
    depends_on:
      - server
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped
    networks:
      - dimmelo

networks:
  postgres:
    external: true
  dimmelo:
    driver: bridge
