services:
  server:
    image: palio-server:${IMAGE_TAG:-latest}
    build:
      context: ./server
    env_file:
      - .env.production
    restart: unless-stopped
    networks:
      - postgres
      - dimmelo

  client:
    image: palio-client:${IMAGE_TAG:-latest}
    build:
      context: ./client
    depends_on:
      - server
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped
    networks:
      - dimmelo

networks:
  postgres:
    external: true
  dimmelo:
    driver: bridge
